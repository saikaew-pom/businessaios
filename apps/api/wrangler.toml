name = "businessaios-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "8d3b88fb762aaac5e9feca0421310dfb"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "businessaios-db"
database_id = "d545a3fc-09ec-40c1-99f2-2dd239faedb0"
migrations_dir = "migrations"

# R2 Bucket (file storage)
[[r2_buckets]]
binding = "R2"
bucket_name = "businessaios-exports"

# Environment variables
[vars]
ALLOWED_ORIGIN = "https://businessaios-web.pskspace.workers.dev,https://businessaios.pages.dev,https://businessaios-web.pskspace.workers.dev"
RESEND_FROM_EMAIL = "onboarding@resend.dev"
NOTIFY_EMAIL = "watcharapong.saikaew@gmail.com"
MINIMAX_MODEL = "MiniMax-M3"
TURNSTILE_SITE_KEY = "0x4AAAAAAD-Tp8_cHI9Xl8wM"
TURNSTILE_REQUIRED = "false"
STRIPE_PUBLISHABLE_KEY = "pk_test_xxx"  # set via wrangler secret in production

# Secrets (set via `wrangler secret put NAME`)
# BREVO_API_KEY - email sending (transactional emails via Brevo — code reads this, NOT Resend)
# BREVO_FROM_EMAIL - verified sender address for Brevo (falls back to noreply@businessaios.com if unset —
#                     that address must be a verified/authenticated sender in Brevo or mail gets spam-filtered)
# GOOGLE_CLIENT_ID - Google OAuth client id
# GOOGLE_CLIENT_SECRET - Google OAuth client secret
# GOOGLE_REDIRECT_URI - must exactly match an "Authorized redirect URI" registered in Google Cloud Console
#                        (falls back to `${request origin}/api/auth/google/callback` if unset)
# TURNSTILE_SECRET - Cloudflare Turnstile server-side secret (site key is public, above)
# MINIMAX_API_KEY - AI API
# MINIMAX_GROUP_ID - AI group ID
# SESSION_SECRET - cookie signing (auto-generated, fallback to dev-secret)
# STRIPE_SECRET_KEY - Stripe API (PromptPay payments) — set via wrangler secret
# STRIPE_WEBHOOK_SECRET - Stripe webhook signing secret — set via wrangler secret

[observability]
enabled = true
